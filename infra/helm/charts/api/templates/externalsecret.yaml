# ExternalSecret — pulls secrets from Azure Key Vault into a K8s Secret.
# Requires External Secrets Operator + a ClusterSecretStore pointing to Key Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "api.fullname" . }}-secrets
  labels: {{ include "api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.keyVault.secretRefreshInterval }}
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: {{ include "api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-connection-string
      remoteRef:
        key: db-connection-string
    - secretKey: redis-connection-string
      remoteRef:
        key: redis-connection-string
    - secretKey: blob-connection-string
      remoteRef:
        key: blob-connection-string
    - secretKey: jwt-authority
      remoteRef:
        key: jwt-authority
    - secretKey: jwt-audience
      remoteRef:
        key: jwt-audience
