apiVersion: v2
name: product-management
description: |
  Umbrella chart for the E-Commerce Product Management system.
  Wires api + frontend + observability + platform dependencies.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: api
    version: "0.1.0"
    repository: "file://../charts/api"

  - name: frontend
    version: "0.1.0"
    repository: "file://../charts/frontend"

  # Community charts — disabled in cloud envs (use managed services instead)
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "19.6.4"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  # Observability
  - name: kube-prometheus-stack
    version: "61.3.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled

  - name: jaeger
    version: "3.3.1"
    repository: "https://jaegertracing.github.io/helm-charts"
    condition: jaeger.enabled

  # Platform
  - name: external-secrets
    version: "0.10.3"
    repository: "https://charts.external-secrets.io"
    condition: external-secrets.enabled

  - name: cert-manager
    version: "v1.15.3"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled

  - name: ingress-nginx
    version: "4.11.2"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
