# ── prod environment values ─────────────────────────────────────────────────
# image.tag is updated automatically by CI pipeline (T10.17)
api:
  image:
    tag: "latest"  # CI updates this to git SHA on every deploy
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  auth:
    enabled: false   # set to true when Entra ID is configured
  cors:
    allowedOrigins:
      - "https://app.example.com"
  rateLimit:
    writeRequestsPerMinute: 1000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
  observability:
    otlpEndpoint: "http://product-management-jaeger-collector:4317"

frontend:
  image:
    tag: "latest"  # CI updates this to git SHA on every deploy
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  ingress:
    hosts:
      - host: app.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: frontend-tls-prod
        hosts: ["app.example.com"]

postgresql:
  enabled: false

redis:
  enabled: false

kube-prometheus-stack:
  enabled: true
  grafana:
    persistence:
      enabled: true
      size: 10Gi
  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 50Gi

jaeger:
  enabled: true

external-secrets:
  enabled: true

cert-manager:
  enabled: true
  installCRDs: false

ingress-nginx:
  enabled: true
