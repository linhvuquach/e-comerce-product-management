name: Build & Push — Frontend

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/build-push-fe.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/build-push-fe.yml"

permissions:
  id-token: write  # OIDC federated auth → Azure (no stored credentials)
  contents: write  # commit GitOps image tag update back to repo

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}  # e.g. pmdevacr.azurecr.io

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm tsc

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Test
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ── Build & push (master only, gated on test) ──────────────────────────────
  build:
    name: Build & Push frontend image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/frontend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/frontend:cache,mode=max

  # ── GitOps tag update (gated on build) ────────────────────────────────────
  update-gitops:
    name: Update GitOps — frontend image tag
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update frontend image tag in prod values
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: yq e -i '.frontend.image.tag = strenv(IMAGE_TAG)' infra/helm/umbrella/values/prod.yaml

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/umbrella/values/prod.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update frontend image tag to ${IMAGE_TAG} [skip ci]"
          git push
