name: Build & Push — Backend

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/build-push-be.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/build-push-be.yml"

permissions:
  id-token: write  # OIDC federated auth → Azure (no stored credentials)
  contents: write  # commit GitOps image tag update back to repo

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}  # e.g. pmdevacr.azurecr.io

jobs:
  # ── CI gate ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: productmgmt
          POSTGRES_PASSWORD: productmgmt_test
          POSTGRES_DB: productmanagement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U productmgmt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --severity warn

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=productmanagement_test;Username=productmgmt;Password=productmgmt_test"
          ConnectionStrings__Redis: "localhost:6379"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          retention-days: 7

  # ── Build & push (master only, gated on test) ──────────────────────────────
  build:
    name: Build & Push API image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ProductManagement.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/api:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/api:cache,mode=max

  # ── GitOps tag update (gated on build) ────────────────────────────────────
  update-gitops:
    name: Update GitOps — api image tag
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update api image tag in prod values
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: yq e -i '.api.image.tag = strenv(IMAGE_TAG)' infra/helm/umbrella/values/prod.yaml

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/umbrella/values/prod.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update api image tag to ${IMAGE_TAG} [skip ci]"
          git push
